name: TP Windows CUDA binary

on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: turboprefill-mtp

      - name: Install CUDA Toolkit 12.4
        shell: pwsh
        run: |
          $v = "12.4"
          $base = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$v"
          mkdir -p $base
          $urls = @(
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.4.99-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-12.4.131-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-12.4.127-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/libcublas/windows-x86_64/libcublas-windows-x86_64-12.4.5.8-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-12.4.127-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-12.4.127-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/visual_studio_integration/windows-x86_64/visual_studio_integration-windows-x86_64-12.4.127-archive.zip",
            "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.4.127-archive.zip"
          )
          foreach ($u in $urls) {
            curl.exe -sSfLO $u
            $name = [IO.Path]::GetFileName($u)
            unzip -q $name -d $base
          }
          Get-ChildItem $base -Directory | Where-Object { $_.Name -like "*windows*" } | ForEach-Object {
            xcopy "$($_.FullName)\*" $base /E /I /H /Y
          }

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Build
        shell: cmd
        env:
          CUDAToolkit_ROOT: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set "PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin;%PATH%"
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=OFF ^
            -DGGML_CPU_ALL_VARIANTS=OFF ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=61-real;75-real;86-real;120a-real ^
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS% --target llama-server

      - name: Collect artifacts
        shell: pwsh
        run: |
          mkdir -p dist
          copy build\bin\Release\llama-server.exe dist\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\cudart64_12.dll" dist\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\cublas64_12.dll" dist\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\cublasLt64_12.dll" dist\
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp-cuda124-win
          path: dist/